<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학용어챌린지</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #e3f2fd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }
        h1 {
            color: #1565c0;
            margin-bottom: 20px;
        }
        
        button {
            background-color: #1976d2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background-color: #0d47a1;
            transform: translateY(-2px);
        }

        /* 처음으로 버튼 스타일 */
        .home-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            font-size: 0.9em;
            background-color: #90caf9;
            color: #1565c0;
        }
        .home-btn:hover {
            background-color: #64b5f6;
        }
        
        input[type="text"] {
            width: 70%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #90caf9;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        #start-screen, #selection-screen, #elem-selection-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .grade-btn {
            padding: 15px;
            font-size: 1.2em;
            width: 100%;
            background-color: #fff;
            color: #1976d2;
            border: 2px solid #1976d2;
        }
        .grade-btn:hover {
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        
        .elem-btn {
            padding: 15px;
            font-size: 1.1em;
            width: 100%;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }
        .elem-btn:hover {
            background-color: #c8e6c9;
            color: #1b5e20;
        }
        
        /* 진행률 관련 스타일 */
        .quiz-header-info {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
            background: #f1f8e9;
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }
        .progress-info {
            width: 100%;
            margin-bottom: 20px;
        }
        .progress-text {
            text-align: right;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }
        .progress-bar {
            height: 100%;
            background-color: #42a5f5;
            width: 0%;
            transition: width 0.3s;
        }

        .question-box {
            font-size: 1.2em;
            margin: 20px 0;
            padding: 20px;
            background-color: #f3e5f5;
            border: 2px solid #ce93d8;
            border-radius: 8px;
            color: #4a148c;
            font-weight: bold;
            word-break: keep-all;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-msg {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            font-size: 1.1em;
            white-space: pre-line;
            line-height: 1.5;
        }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        
        .master-badge {
            background-color: #ffeb3b;
            color: #f57f17;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            display: inline-block;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 2px solid #fbc02d;
            max-width: 95%;
            word-break: keep-all;
        }
        
        .score-board {
            font-size: 1.3em;
            margin: 20px 0;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 10px;
            color: #0d47a1;
            font-weight: bold;
        }

        /* 모달 */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            animation: fadeIn 0.4s;
        }
        .modal-content {
            background-color: #fff;
            margin: 30vh auto; 
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: popUp 0.3s;
            border: 3px solid #42a5f5;
        }
        .modal-text {
            font-size: 1.4em;
            color: #1565c0;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .emoji { font-size: 3em; display: block; margin-bottom: 10px; }
        
        .bottom-info {
            margin-top: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .player-name {
            font-size: 1.1em;
            color: #1565c0;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .footer {
            font-weight: bold;
            color: #777;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .warning-text {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
            display: block;
        }
        .hidden { display: none !important; }
        
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes popUp { from {transform: scale(0.7);} to {transform: scale(1);} }
    </style>
</head>
<body>

    <div class="container">
        <button id="home-btn" class="home-btn hidden" onclick="location.reload()">🏠 처음으로</button>

        <h1>수학용어챌린지</h1>

        <div id="start-screen">
            <p>도전자 ID를 입력하고 도전하세요.</p>
            <input type="text" id="username-input" placeholder="도전자 ID 입력" onkeyup="enterToNext()">
            <button onclick="goToSelection()">다음 단계로</button>
        </div>

        <div id="selection-screen" class="hidden">
            <p style="font-size:1.2em; font-weight:bold;">도전할 과정을 선택하세요!</p>
            <button class="grade-btn" style="border-color:#2e7d32; color:#2e7d32;" onclick="showElemSelection()">초등수학</button>
            <button class="grade-btn" onclick="startGame('m1')">중학교 1학년</button>
            <button class="grade-btn" onclick="startGame('m2')">중학교 2학년</button>
            <button class="grade-btn" onclick="startGame('m3')">중학교 3학년</button>
        </div>

        <div id="elem-selection-screen" class="hidden">
            <p style="font-size:1.2em; font-weight:bold;">단원을 선택하세요</p>
            <button class="elem-btn" onclick="startGame('e1')">1. 수와 연산</button>
            <button class="elem-btn" onclick="startGame('e2')">2. 도형과 측정</button>
            <button class="elem-btn" onclick="startGame('e3')">3. 변화와 관계</button>
            <button class="elem-btn" onclick="startGame('e4')">4. 자료와 가능성</button>
            <button style="background-color:#999; margin-top:10px;" onclick="backToMainSelection()">뒤로가기</button>
        </div>

        <div id="quiz-area" class="hidden">
            <div id="quiz-info-text" class="quiz-header-info"></div>
            
            <div class="progress-info">
                <div class="progress-text">진행률: <span id="current-num">1</span> / <span id="total-num">20</span></div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <div class="question-box" id="question-text">
                문제 로딩 중...
            </div>

            <input type="text" id="answer-input" placeholder="정답 입력" onkeyup="enterKey()">
            <br>
            <button onclick="checkAnswer()">확인</button>
            <div id="result-msg"></div>
        </div>

        <div id="finish-area" class="hidden">
            <h2 id="final-title">챌린지 종료!</h2>
            
            <div class="score-board">
                최종 결과<br>
                <span id="final-score" style="font-size:1.5em; color:#1565c0;"></span>
            </div>

            <div id="badge-area" class="hidden">
                <div class="master-badge">🏆 <span id="master-badge-text">마스터</span></div>
                <p style="margin-top:15px; font-weight:bold; color:#f57f17;">완벽합니다! 20문제를 모두 스스로 맞혔습니다!</p>
            </div>
            
            <p id="review-msg" class="hidden" style="color:#555; margin-top:15px;">
                오답이 있었습니다. 다음엔 마스터에 도전해보세요!
            </p>

            <button onclick="location.reload()">처음으로 돌아가기</button>
            <p id="saving-text" style="color:blue; font-size:0.8em; margin-top:20px;">(기록 저장 중...)</p>
        </div>

        <div class="bottom-info">
            <div id="player-display" class="player-name hidden">도전자 ID : </div>
            <div class="footer">
                제작자 : 연구부장의 수학노트
                <span class="warning-text">본 저작물의 무단 복제 및 배포를 금합니다.</span>
            </div>
        </div>
    </div>

    <div id="praise-modal" class="modal">
        <div class="modal-content">
            <span class="emoji">🎉</span>
            <div class="modal-text" id="praise-text">5문제 돌파!<br>아주 잘하고 있어요!</div>
            <button onclick="closeModal()">계속하기</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 구글 앱스 스크립트 URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1EPOLPtCGiwC2-Qiu9JRjM8I-i3D-t14-27FkWnKywYqHLdlvLSE9pVSgvAgQenc/exec"; 
        // ==========================================
        
        // ------------------------------------------
        // [초등수학 데이터]
        // ------------------------------------------
        const dataElem1 = [ // 1. 수와 연산
            {term:"덧셈", def:"몇 개의 수를 합하여 계산하는 것"}, {term:"뺄셈", def:"몇 개의 수를 빼서 계산하는 것"}, {term:"곱셈", def:"몇 개의 수를 곱하여 계산하는 것"}, {term:"짝수", def:"2로 나누어서 나머지가 0이 되는 수"}, {term:"홀수", def:"2로 나누어서 나머지가 1이 남는 수"}, {term:"나눗셈", def:"몇 개의 수를 나누어 계산하는 것"}, {term:"몫", def:"나눗셈을 했을 때 나누어 떨어진 수"}, {term:"나머지", def:"나눗셈에서 나누어 떨어지지 않고 남은 수"}, {term:"분수", def:"정수 a를 0이 아닌 정수 b로 나눈 몫을 a/b로 표시한 것"}, {term:"분모", def:"분수에서 전체의 크기를 나타내는 아래 수"}, {term:"분자", def:"분수에서 일부의 크기를 나타내는 위 수"}, {term:"단위분수", def:"분모가 자연수이고 분자가 1인 분수"}, {term:"진분수", def:"분자가 분모보다 작은 분수"}, {term:"가분수", def:"분자가 분모와 같거나 분모보다 큰 분수"}, {term:"대분수", def:"자연수와 진분수가 합쳐진 분수"}, {term:"자연수", def:"1, 2, 3처럼 셀 수 있는 수"}, {term:"소수", def:"일의 자리보다 작은 자리의 값을 가진 수"}, {term:"소수점", def:"소수 부분과 정수 부분 사이에 찍는 부호 ‘.’"}, {term:"이상", def:"수량이 일정한 기준보다 더 많음 (기준 포함)"}, {term:"이하", def:"수량이 일정한 기준보다 더 적음 (기준 포함)"}, {term:"초과", def:"기준 수량이 범위에 포함되지 않으면서 그 위인 경우"}, {term:"미만", def:"기준 수량이 범위에 포함되지 않으면서 그 아래인 경우"}, {term:"올림", def:"수를 가까운 큰 수로 올려주는 계산 방법"}, {term:"버림", def:"어떤 자릿수 아래 숫자를 버리고 수를 작게 만드는 방법"}, {term:"반올림", def:"은 어떤 수를 가장 가까운 수로 바꾸는 계산 방법"}, {term:"약수", def:"어떤 정수를 나머지 없이 나눌 수 있는 정수"}, {term:"공약수", def:"둘 이상의 정수에 공통되는 약수"}, {term:"최대공약수", def:"둘 이상의 정수의 공약수 가운데 가장 큰 수"}, {term:"배수", def:"어떤 정수의 몇 배가 되는 수"}, {term:"공배수", def:"둘 이상의 정수에 공통되는 배수"}, {term:"최소공배수", def:"둘 이상의 정수의 공배수 중 0을 제외한 가장 작은 수"}, {term:"약분", def:"분수의 분모와 분자를 공약수로 나누어 간단하게 만드는 것"}, {term:"통분", def:"분모가 다른 둘 이상의 분수에서 분모를 같게 만드는 것"}, {term:"기약분수", def:"더 이상 약분되지 않는 분수"}
        ];

            { term: "도수분포표", def: "계급별 도수를 정리한 표" },
            { term: "히스토그램", def: "도수분포를 막대그래프로 나타낸 것" },
            { term: "도수분포다각형", def: "히스토그램의 각 직사각형 윗변의 중점과 양 끝의 도수가 0인 계급의 중점을 선분으로 연결한 그래프" },
            { term: "상대도수", def: "전체에 대한 각 계급의 도수의 비율" }
        ];

        const dataGrade2 = [
            { term: "유한소수", def: "소수점 아래 자릿수가 끝나는 소수" },
            { term: "무한소수", def: "소수점 아래가 끝없이 계속 되는 소수" },
            { term: "순환소수", def: "소수점 아래 일정한 숫자가 반복되는 소수" },
            { term: "순환마디", def: "순환소수에서 반복되는 숫자 부분" },
            { term: "일차부등식", def: "미지수의 지수가 1인 부등식" },
            { term: "연립방정식", def: "여러 개의 방정식을 함께 풀어 미지수 값을 구하는 식" },
            { term: "일차함수", def: "그래프가 직선인 차수가 1인 함수" },
            { term: "기울기", def: "직선의 기울어진 정도를 수로 나타낸 값" },
            { term: "x절편", def: "일차함수의 그래프가 x축과 만나는 점의 x좌표" },
            { term: "y절편", def: "일차함수의 그래프가 y축과 만나는 점의 y좌표" },
            { term: "평행이동", def: "도형이 위아래, 또는 좌우로 이동하는 것" },
            { term: "직선의 방정식", def: "직선 위의 모든 점을 만족시키는 방정식" },
            { term: "접선", def: "곡선과 한 점에서 접하는 직선" },
            { term: "접점", def: "접선과 곡선이 만나는 한 점" },
            { term: "외심", def: "삼각형의 세 변을 수직이등분선이 만나는 점" },
            { term: "외접", def: "도형 바깥에서 둘러싸며 접하는 상태" },
            { term: "외접원", def: "삼각형의 꼭짓점을 모두 지나는 원" },
            { term: "내심", def: "삼각형의 세 각의 이등분선이 만나는 점" },
            { term: "내접", def: "도형 안쪽에 맞닿으며 들어 있는 상태" },
            { term: "내접원", def: "삼각형의 각 변에 접하는 원" },
            { term: "중선", def: "삼각형에서 꼭짓점과 그 반대편 변의(대변) 의 중점을 잇는 선" },
            { term: "무게중심", def: "삼각형의 세 중선이 만나는 점" },
            { term: "닮음", def: "모양이 같고 크기만 다른 도형 관계" },
            { term: "닮음비", def: "닮은 도형에서 대응하는 길이의 비율" },
            { term: "피타고라스 정리", def: "직각삼각형에서 빗변의 제곱이 다른 두 변의 제곱의 합과 같다는 정리" },
            { term: "확률", def: "어떤 사건이 일어날 가능성" }
        ];

        const dataGrade3 = [
            { term: "제곱근", def: "어떤 수를 두 번 곱해서 만든 수의 원래 수" },
            { term: "근호", def: "제곱근을 나타낼 때 사용하는 기호" },
            { term: "무리수", def: "분수로 나타낼 수 없는 소수" },
            { term: "실수", def: "수직선 위의 모든 수 (유리수 + 무리수)" },
            { term: "분모의 유리화", def: "분수의 분모에 있는 근호(루트)를 없애서 유리수로 고치는 과정" },
            { term: "인수", def: "곱셈으로 표현된 식의 각 요소" },
            { term: "인수분해", def: "다항식을 인수들의 곱으로 바꾸는 것" },
            { term: "완전제곱식", def: "두 항의 합 또는 차 전체의 제곱으로 나타낼 수 있는 식" },
            { term: "이차방정식", def: "차수가 2인 방정식" },
            { term: "중근", def: "두 근이 같은 이차방정식의 해" },
            { term: "근의 공식", def: "이차방정식의 해를 구하는 공식" },
            { term: "이차함수", def: "차수가 2인 함수를 나타내는 식" },
            { term: "포물선", def: "이차함수의 그래프 모양" },
            { term: "꼭짓점", def: "포물선에서 가장 높은 점 또는 가장 낮은 점" },
            { term: "삼각비", def: "직각삼각형의 각의 크기에 따른 변의 길이의 비율을 나타내는 값" },
            { term: "사인", def: "직각삼각형에서 높이 ÷ 빗변" },
            { term: "코사인", def: "직각삼각형에서 밑변 ÷ 빗변" },
            { term: "탄젠트", def: "직각삼각형에서 높이 ÷ 밑변" },
            { term: "원주각", def: "원 위의 한 점에서 그은 두 현이 이루는 각" },
            { term: "대푯값", def: "자료 전체를 대표하는 값 (평균, 중앙값, 최빈값)" },
            { term: "중앙값", def: "자료를 크기 순으로 나열했을 때 가운데에 위치한 값" },
            { term: "최빈값", def: "자료에서 가장 자주 나타나는 값" },
            { term: "산포도", def: "자료가 퍼져 있는 정도를 시각적으로 나타낸 그래프" },
            { term: "편차", def: "각 자료값에서 평균을 뺀 값" },
            { term: "분산", def: "편차를 제곱한 값들의 평균" },
            { term: "표준편차", def: "분산의 양의 제곱근으로 나타낸 자료의 퍼짐 정도" },
            { term: "산점도", def: "두 자료의 대응 관계를 점으로 나타낸 그래프" },
            { term: "상관관계", def: "두 자료 사이의 관련성과 방향을 나타내는 관계" }
        ];

        // 게임 상태 변수
        let currentType = ""; // 'm1', 'm2', 'm3', 'e1', 'e2', 'e3', 'e4'
        let currentUnitName = ""; // 결과 출력용 이름
        let quizList = [];
        let currentIndex = 0;
        let wrongCount = 0;
        let correctAnswersCount = 0; 
        let currentPlayerName = "";
        let totalQuizCount = 0;
        let isElementary = false;

        // 1. 이름 입력 -> 메인 선택 화면
        function goToSelection() {
            const nameInput = document.getElementById('username-input');
            currentPlayerName = nameInput.value.trim();

            if (!currentPlayerName) {
                alert('도전자 ID를 입력해주세요!');
                return;
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            const playerDisplay = document.getElementById('player-display');
            playerDisplay.innerText = "도전자 ID : " + currentPlayerName;
            playerDisplay.classList.remove('hidden');
        }

        function enterToNext() {
            if (window.event.keyCode == 13) {
                goToSelection();
            }
        }

        // 2. 메인 선택 화면 -> 초등 선택 화면
        function showElemSelection() {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('elem-selection-screen').classList.remove('hidden');
        }

        function backToMainSelection() {
            document.getElementById('elem-selection-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }

        // 3. 게임 시작 로직
        function startGame(type) {
            currentType = type;
            let dataSource = [];
            
            // 데이터 매핑 및 설정
            if (type === 'm1') {
                dataSource = dataGrade1;
                currentUnitName = "중학교 1학년";
                isElementary = false;
            } else if (type === 'm2') {
                dataSource = dataGrade2;
                currentUnitName = "중학교 2학년";
                isElementary = false;
            } else if (type === 'm3') {
                dataSource = dataGrade3;
                currentUnitName = "중학교 3학년";
                isElementary = false;
            } else if (type === 'e1') {
                dataSource = dataElem1;
                currentUnitName = "1.수와연산";
                isElementary = true;
            } else if (type === 'e2') {
                dataSource = dataElem2;
                currentUnitName = "2.도형과 측정";
                isElementary = true;
            } else if (type === 'e3') {
                dataSource = dataElem3;
                currentUnitName = "3.변화와 관계";
                isElementary = true;
            } else if (type === 'e4') {
                dataSource = dataElem4;
                currentUnitName = "4.자료와 가능성";
                isElementary = true;
            }

            // 공통: 순서 섞기
            const shuffled = [...dataSource].sort(() => 0.5 - Math.random());
            const originalTotal = dataSource.length;

            // 공통: 20문제 랜덤 (데이터가 20개 미만이면 전체)
            const questionLimit = 20;
            quizList = shuffled.slice(0, questionLimit);
            totalQuizCount = quizList.length;
            
            document.getElementById('quiz-info-text').innerText = `총 ${originalTotal}문제 중 ${totalQuizCount}문제가 무작위로 출제되었습니다.`;

            // 화면 전환
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('elem-selection-screen').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            document.getElementById('home-btn').classList.remove('hidden');
            document.getElementById('total-num').innerText = totalQuizCount;

            currentIndex = 0;
            correctAnswersCount = 0;
            showQuestion();
        }

        // 4. 퀴즈 표시
        function showQuestion() {
            if (currentIndex >= quizList.length) {
                endGame();
                return;
            }

            wrongCount = 0;
            document.getElementById('answer-input').value = '';
            document.getElementById('result-msg').innerHTML = '';
            document.getElementById('answer-input').focus();
            
            document.getElementById('current-num').innerText = currentIndex + 1;
            const progressPercent = ((currentIndex) / totalQuizCount) * 100;
            document.getElementById('progress-bar').style.width = progressPercent + "%";
            document.getElementById('question-text').innerText = quizList[currentIndex].def;
        }

        function checkAnswer() {
            const inputField = document.getElementById('answer-input');
            const userInput = inputField.value.trim().replace(/\s+/g, '');
            const correctAnswer = quizList[currentIndex].term.replace(/\s+/g, '');
            const msgBox = document.getElementById('result-msg');

            if (userInput.toLowerCase() === correctAnswer.toLowerCase()) {
                // 정답 로직
                msgBox.className = 'correct';
                msgBox.innerText = '정답입니다.';
                
                if (wrongCount < 2) {
                    correctAnswersCount++; 
                }

                setTimeout(() => {
                    currentIndex++;
                    // 5문제마다 칭찬 모달
                    if (currentIndex > 0 && currentIndex % 5 === 0 && currentIndex < totalQuizCount) {
                        showPraiseModal();
                    } else {
                        showQuestion();
                    }
                }, 1000);

            } else {
                // 오답 로직
                wrongCount++;
                msgBox.className = 'wrong';
                
                if (wrongCount >= 2) {
                    msgBox.innerHTML = `틀렸습니다.<br>정답은 <b>'${quizList[currentIndex].term}'</b>입니다.<br>위 정답을 입력창에 똑같이 입력해야 넘어갑니다.`;
                    inputField.value = '';
                    inputField.focus();
                } else {
                    msgBox.innerText = '다시 한 번 생각해보세요. (1회 오류)';
                    inputField.select();
                }
            }
        }

        function showPraiseModal() {
            const modal = document.getElementById('praise-modal');
            const praiseText = document.getElementById('praise-text');
            praiseText.innerHTML = `${currentIndex}문제 돌파!<br>아주 잘하고 있어요!`;
            modal.style.display = "block";
        }

        function closeModal() {
            document.getElementById('praise-modal').style.display = "none";
            showQuestion();
        }

        function enterKey() {
            if (window.event.keyCode == 13) {
                checkAnswer();
            }
        }

        // 5. 게임 종료
        function endGame() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('finish-area').classList.remove('hidden');
            document.getElementById('home-btn').classList.add('hidden');
            document.getElementById('progress-bar').style.width = "100%";

            const scoreText = document.getElementById('final-score');
            
            // 만점 체크
            if (correctAnswersCount === totalQuizCount) {
                scoreText.innerText = `${correctAnswersCount} / ${totalQuizCount}`;
                document.getElementById('badge-area').classList.remove('hidden');
                document.getElementById('review-msg').classList.add('hidden');
                
                const badgeText = document.getElementById('master-badge-text');
                
                if (isElementary) {
                    // 초등 멘트: "초등수학 1.수와연산 용어 마스터 'ID'님"
                    badgeText.innerText = `초등수학 ${currentUnitName} 용어 마스터 '${currentPlayerName}'님`;
                } else {
                    // 중등 멘트: "중1 수학 용어 마스터 'ID'님"
                    let gradeStr = "";
                    if(currentType === 'm1') gradeStr = "중1";
                    else if(currentType === 'm2') gradeStr = "중2";
                    else if(currentType === 'm3') gradeStr = "중3";
                    
                    badgeText.innerText = `${gradeStr} 수학 용어 마스터 '${currentPlayerName}'님`;
                }

            } else {
                scoreText.innerText = `${correctAnswersCount} / ${totalQuizCount}`;
                document.getElementById('badge-area').classList.add('hidden');
                document.getElementById('review-msg').classList.remove('hidden');
            }

            // 구글 시트 전송
            sendDataToSheet();
        }

        function sendDataToSheet() {
            if (SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL") {
                document.getElementById('saving-text').innerText = "스크립트 URL이 설정되지 않았습니다.";
                return;
            }

            // 기록용 텍스트 변환
            let gradeText = "";
            if (isElementary) gradeText = "초등(" + currentUnitName + ")";
            else gradeText = currentUnitName; // 중학교 X학년
            
            const finalResult = `${correctAnswersCount} / ${totalQuizCount}`;
            const url = `${SCRIPT_URL}?name=${encodeURIComponent(currentPlayerName)}&grade=${encodeURIComponent(gradeText)}&result=${encodeURIComponent(finalResult)}`;

            fetch(url)
                .then(response => {
                    document.getElementById('saving-text').innerText = "(기록 저장 완료!)";
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('saving-text').innerText = "(저장 실패)";
                });
        }
    </script>
</body>
</html>
